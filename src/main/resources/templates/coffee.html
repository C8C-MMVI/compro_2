<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: html(
        content=~{::main},
        docTitle=~{::title},
        customCss=~{::link}
      )}">
<head>
    <title th:text="'View Coffee | ' + ${coffee.name}">View Coffee</title>
    <link th:href="@{/css/card.css}" rel="stylesheet">
</head>
<body>
<main>
    <div class="coffee-card">
        <div class="profile">
            <img class="profile-img" th:if="${coffee.picture != null}"
                 th:src="@{'/' + ${coffee.picture}}"
                 alt="Coffee Image">

            <h2 th:text="${coffee.name}">Coffee Name</h2>
            <p th:text="'Type: ' + ${coffee.type}"></p>
        </div>

        <div class="details">
            <div><strong>Size:</strong> <span th:text="${coffee.size}"></span></div>
            <div><strong>Price:</strong> <span th:text="${coffee.price}"></span></div>
            <div><strong>Roast Level:</strong> <span th:text="${coffee.roastLevel}"></span></div>
            <div><strong>Origin:</strong> <span th:text="${coffee.origin}"></span></div>
            <div><strong>Decaf:</strong> <span th:text="${coffee.decaf} ? 'Yes' : 'No'"></span></div>
            <div><strong>Stock:</strong> <span th:text="${coffee.stock}"></span></div>
            <div><strong>Flavor Notes:</strong> <span th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></span></div>
            <div><strong>Brew Method:</strong> <span th:text="${coffee.brewMethod}"></span></div>
        </div>
    </div>

    <a th:href="@{/}" class="button">Back to Main List</a>
</main>
</body>
</html>
