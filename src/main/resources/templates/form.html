<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    div > label{
        font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>New Coffee</h1>
  <div>
    <form action="/save" method="POST">
      <div>
        <label for="cname">Coffee Name</label>
        <input type="text" id="cname" name="name">
      </div>

      <div>
        <label for="ctype">Coffee Type</label>
        <input type="text" id="ctype" name="type">
      </div>

      <div>
        <label for="csize">Coffee Size</label>
        <input type="text" id="csize" name="size">
      </div>

      <div>
        <label for="cprice">Coffee Price (PHP)</label>
        <input type="text" id="cprice" name="price">
      </div>
      <button>Save</button>
    </form>
  </div>
  <a href="/">Back to List</a>
</body>
</html>
