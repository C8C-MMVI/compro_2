<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment named 'coffeeCard' that takes a list 'coffees' -->
<div th:fragment="coffeeCard(coffees)">
  <div class="coffee-grid">
    <div class="coffee-card" th:each="coffee : ${coffees}">

      <img class="profile-img" th:src="${coffee.picture}" alt="Coffee Image">

      <div class="coffee-card-body">
        <h2 class="coffee-name" th:text="${coffee.name}">Coffee Name</h2>

        <div class="coffee-price" th:text="'₱' + ${coffee.price}">$0.00</div>

        <a th:href="@{'/coffee/view'(id=${coffee.id})}" class="view-details">
          View Details
        </a>
      </div>

    </div>
  </div>
</div>
</body>
</html>
