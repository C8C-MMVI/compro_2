<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coffee List</title>
    <style>
        h1{
            color: brown;
            font-family: sans-serif;
        }
        table > thead > th{
            color: red;
            font-family: sans-serif;
        }

        li > a{
            color: blue;
            text-decoration: none;
        }
    </style>
</head>
<body>
<a href="/add">Add Coffee</a>
<h1>Available Coffees</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Size</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="coffee: ${coffeeList}">
        <td th:text = "${coffee.id}"></td>
        <td th:text = "${coffee.name}"></td>
        <td th:text = "${coffee.type}"></td>
        <td th:text = "${coffee.size}"></td>
        <td th:text = "${coffee.price}"></td>
        <td>
            <a th:href = "@{/delete(id=${coffee.id})}">Delete</a>
            <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
