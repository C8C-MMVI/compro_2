<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit [[${coffee.name}]]</title>
  <link th:href="@{/css/formStyle.css}" rel="stylesheet">
</head>
<body>
<header>
  <div>
    <h1>COFFEE COFFEE</h1>
  </div>
</header>
<main>
  <h2 th:text="'Edit ' + ${coffee.name}"></h2>
  <div class="add-form">
    <form th:action="@{/update}" method="POST">
      <input type="hidden" name="id" th:value="${coffee.id}">
      <div>
        <label>Coffee Name</label>
        <input type="text" name="name" th:value="${coffee.name}" required>
      </div>

      <div>
        <label>Coffee Type</label>
        <input type="text" name="type" th:value="${coffee.type}" required>
      </div>

      <div>
        <label>Coffee Size</label>
        <input type="text" name="size" th:value="${coffee.size}" required>
      </div>

      <div>
        <label>Coffee Price (PHP)</label>
        <input type="text" name="price" th:value="${coffee.price}" required>
      </div>

      <div>
        <label>Roast Level</label>
        <input type="text" name="roastLevel" th:value="${coffee.roastLevel}" required>
      </div>

      <div>
        <label>Coffee Origin</label>
        <input type="text" name="origin" th:value="${coffee.origin}" required>
      </div>

      <div>
        <label>Coffee Stock</label>
        <input type="text" name="stock" th:value="${coffee.stock}" required>
      </div>

      <div>
        <label>Flavor Notes</label>
        <input type="text" name="flavorNotes" th:value="${coffee.flavorNotes}" required>
      </div>

      <div>
        <label>Brew Method</label>
        <input type="text" name="brewMethod" th:value="${coffee.brewMethod}" required>
      </div>

      <div id="formActions">
        <button>Save</button>
        <a href="/">Back to List</a>
      </div>

    </form>
  </div>
</main>
<footer>
  <h1>COFFEE COFFEE</h1>
  <p>All Rights Reserved. Copyright 2025 by Allon-sy Co.</p>
</footer>
</body>
</html>
